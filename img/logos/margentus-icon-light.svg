<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Margentus — ícono, uso en claro</title>
<desc>Isotipo Margentus v3.1: blanco de tiro con tenedor de tres dientes a la izquierda y punta de flecha a la derecha, paleta violeta/azul/cian de la sección 6 del DGL, tipografía Space Grotesk (SIL OFL, libre para uso comercial). Ícono aislado en badge violeta con marca en blanco, para favicon, sidebar o header sobre fondo claro.</desc>

<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;display=swap');
  </style>
  <g id="mg-mark" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="0" cy="0" r="26"/>
    <circle cx="0" cy="0" r="18"/>
    <line x1="-30" y1="0" x2="0" y2="0"/>
    <line x1="-50" y1="-4" x2="-30" y2="-4"/>
    <line x1="-50" y1="0" x2="-30" y2="0"/>
    <line x1="-50" y1="4" x2="-30" y2="4"/>
    <line x1="26" y1="0" x2="30" y2="0"/>
    <path d="M30,-7 L48,0 L30,7"/>
  </g>
</defs>

<rect x="0" y="0" width="140" height="140" rx="28" fill="#6B46C1"/>
<g stroke="#F8FAFC">
  <use href="#mg-mark" xlink:href="#mg-mark" transform="translate(70,70) scale(1.15)"/>
</g>
</svg>
