<svg width="820" height="220" viewBox="0 0 820 220" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Margentus — lockup completo, fondo oscuro</title>
<desc>Isotipo Margentus v3.1: blanco de tiro con tenedor de tres dientes a la izquierda y punta de flecha a la derecha, paleta violeta/azul/cian de la sección 6 del DGL, tipografía Space Grotesk (SIL OFL, libre para uso comercial). Variante para fondo oscuro.</desc>

<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;display=swap');
  </style>
  <g id="mg-mark" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="0" cy="0" r="26"/>
    <circle cx="0" cy="0" r="18"/>
    <line x1="-30" y1="0" x2="0" y2="0"/>
    <line x1="-50" y1="-4" x2="-30" y2="-4"/>
    <line x1="-50" y1="0" x2="-30" y2="0"/>
    <line x1="-50" y1="4" x2="-30" y2="4"/>
    <line x1="26" y1="0" x2="30" y2="0"/>
    <path d="M30,-7 L48,0 L30,7"/>
  </g>
</defs>

<rect x="0" y="0" width="820" height="220" rx="20" fill="#0F172A"/>
<g stroke="#06B6D4">
  <use href="#mg-mark" xlink:href="#mg-mark" transform="translate(110,110)"/>
</g>
<text x="220" y="124" font-size="40" font-weight="700" fill="#F8FAFC" font-family="'Space Grotesk','Segoe UI',sans-serif">Margentus</text>
<text x="220" y="146" font-size="12" fill="#06B6D4" opacity="0.85" font-family="'Space Grotesk','Segoe UI',sans-serif" letter-spacing="2" font-weight="500">TU ANALISTA DE RENTABILIDAD</text>
</svg>
